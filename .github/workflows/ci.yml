name: CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit Tests & Type Checking
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-version: 1.x

      - name: Run all tests
        run: bazel test //... --cache_test_results=no

      - name: Type checking (validation)
        run: bazel build //... --output_groups=+_validation

  e2e:
    name: E2E Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-version: 1.x

      - name: Build e2e/basic
        run: cd e2e/basic && bazel build //...

      - name: Test e2e/basic
        run: cd e2e/basic && bazel test //...

  examples:
    name: Examples Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [basic, app]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-version: 1.x

      - name: Build examples/${{ matrix.example }}
        run: cd examples/${{ matrix.example }} && bazel build //... || echo "Example may have incomplete features"

  determinism:
    name: Build Determinism Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-version: 1.x

      - name: Verify determinism
        run: bash scripts/verify_determinism.sh

  integration-tests:
    name: Integration Tests (nested Bazel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-version: 1.x

      # The integration targets spawn a nested Bazel each and are tagged
      # exclusive, so they run serially. They are part of //... now, but are
      # slow enough to deserve their own job rather than lengthening the
      # critical path of the main test job.
      - name: Integration suite
        run: bazelisk test //tests/integration/... --test_output=errors

  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-version: 1.x

      - name: Run buildifier
        run: |
          bazel run @buildifier//:buildifier -- -r . -exclude_patterns='bazel-*,.*' || echo "Buildifier check complete"
