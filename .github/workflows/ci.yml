name: CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit Tests & Type Checking
    strategy:
      # As in `examples` and `integration-tests`: each leg is its own runner and
      # neither is evidence about the other, so one going red must not cancel
      # the one that could still say something. Left at the default, a failure
      # in the ubuntu-only gate below took the macOS leg down with it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.18.0
        id: setup
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          disk-cache: true

      # `bazel test //...` and a byte-identical Gazelle rerun are both satisfied
      # by a Gazelle run that deletes a test target, so neither notices a
      # hand-written rule going missing. This runs before them because it is a
      # loading-phase query the next step pays for anyway, and it names the
      # cause when a test simply stops existing.
      - name: Every test source file is claimed by a test target
        if: matrix.os == 'ubuntu-latest'
        run: tools/ci/check_test_sources.sh

      # Same argument one step further: nothing goes red when a test runs on no
      # leg of the integration-tests matrix, so the partition is checked here
      # rather than on a leg, off another loading-phase query.
      - name: Every integration test lands on exactly one shard
        if: matrix.os == 'ubuntu-latest'
        run: tools/ci/check_integration_shards.sh

      # Both gates keep their place in front of the suite -- the reason above
      # holds -- but a step defaults to `if: success()`, so either of them going
      # red used to skip everything below on ubuntu while fail-fast cancelled
      # macOS, and `bazel test //...` ran nowhere. That is how #74 to #77 merged
      # onto a red main with the suite effectively switched off. These two run
      # whatever the gates did; the job still fails, because a failed step
      # fails it.
      #
      # --config=ci is defined in .bazelrc. It expands --config=fast, which
      # drops the nested-Bazel targets: those run once per push, spread over the
      # legs of the integration-tests job. Unfiltered they would run three times
      # per push — twice here across the OS matrix, once there.
      - name: Run all tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bazel test --config=ci //...

      - name: Type checking (validation)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bazel build --config=ci //... --output_groups=+_validation

  e2e:
    name: E2E Tests
    strategy:
      # Same shape, same argument: the whole point of the second leg is that it
      # is a different OS, which it cannot report on once the first one has
      # cancelled it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          disk-cache: true

      - name: Build e2e/basic
        run: cd e2e/basic && bazel build //...

      - name: Test e2e/basic
        run: cd e2e/basic && bazel test //...

  examples:
    name: Examples Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - basic
          - app
          - react-app
          - remix-app
          - tanstack-app
          - nextjs-app
        include:
          # //:app loads its vite_config from the source tree and resolves
          # @tanstack/react-start there, where a fresh checkout has no node_modules.
          - example: tanstack-app
            targets: //... -//:app
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      # 432 of every example's ~700 actions are the same oxc/Rust + toolchain
      # prefix, so one key shared by all six legs, not one per leg (10 GB cap).
      - uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          repository-cache: true
          disk-cache: examples

      - name: Build examples/${{ matrix.example }}
        run: cd examples/${{ matrix.example }} && bazel build -- ${{ matrix.targets || '//...' }}

  determinism:
    name: Build Determinism Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          # No disk-cache on purpose: this job builds one target twice from two
          # empty output bases and compares the bytes, so a cache hit on the
          # second build would compare it against a copy of the first.

      # Two output bases are two full toolchain trees; the runner's root disk
      # does not fit both and /mnt, the ephemeral disk, does.
      - name: Provision scratch space on the ephemeral disk
        run: |
          sudo mkdir -p /mnt/rules_ts_det
          sudo chown "$(id -u):$(id -g)" /mnt/rules_ts_det
          df -h /mnt

      # Two builds cannot be one action, so this is the one check that stays a
      # sequence of invocations instead of a target. `info bazel-bin` is asked
      # for the output path rather than guessing at the bazel-out layout.
      - name: Build //tests/smoke:hello twice, from two empty output bases
        run: |
          for base in a b; do
            bazelisk --output_base=/mnt/rules_ts_det/$base \
              build --config=determinism //tests/smoke:hello
            bazelisk --output_base=/mnt/rules_ts_det/$base \
              info bazel-bin > /mnt/rules_ts_det/$base.binpath
          done

      - name: Compare the two outputs byte for byte
        run: |
          a="$(cat /mnt/rules_ts_det/a.binpath)/tests/smoke/hello.js"
          b="$(cat /mnt/rules_ts_det/b.binpath)/tests/smoke/hello.js"
          ls -l -- "$a" "$b"
          cmp -- "$a" "$b"
          sha256sum -- "$a"
          echo "Build is bit-for-bit reproducible."

  integration-tests:
    # 18 nested-Bazel tests at ~3 minutes each. "cpu:2" already runs several at
    # once, so this was never serial -- but one runner only has so many cores,
    # which is what kept the lane at 1164s and on the critical path. These legs
    # spread it over four runners.
    name: Integration Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # As in `examples`: one leg going red must not cancel the others, or a
      # single flaky nested Bazel hides the state of the rest of the suite.
      fail-fast: false
      matrix:
        # One name per `test:ci-integration-<name>` config in //.bazelrc, which
        # is where the tag filter behind each leg lives. `core` is the
        # complement of the other three, so a test added with no shard tag runs
        # there rather than nowhere; check_integration_shards.sh (in the `test`
        # job) fails if these three sources ever disagree.
        shard: [nextjs-tanstack, remix-svelte, npm, core]
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          disk-cache: true

      # Each nested Bazel keeps its own output base and together they need tens
      # of GB. /mnt is no longer a separate ephemeral disk on this image -- it
      # is a directory on the root filesystem, which is why the free space is
      # recorded here and again after the suite.
      #
      # Legs are separate machines, so they need no distinct path -- and one path
      # keeps a local `bazel test --config=ci-integration-<leg>` run identical to
      # what CI does.
      - name: Provision scratch space
        run: |
          sudo mkdir -p /mnt/rules_ts_it
          sudo chown "$(id -u):$(id -g)" /mnt/rules_ts_it
          df -h /mnt /

      # /mnt is recreated every run, so without this the suite fetches ~4GB
      # every time -- and it is what makes running the tests concurrently safe
      # rather than harmful: cold, they would all miss this cache at once and
      # all download the same artifacts. Content-addressed, so a stale restore
      # is a miss and never a wrong answer.
      #
      # One key for all four legs, deliberately: the caches they would build
      # separately overlap almost entirely, and only the first leg to finish
      # gets to save one (the others log "already exists" and move on). Four
      # legs starting cold do not reintroduce the problem this cache solves --
      # that one is several nested Bazel servers racing for ONE repository cache
      # directory, and a leg on its own machine shares that directory with
      # nobody. Cold legs cost four independent fetches of a subset each, and
      # `restore-keys` means a cold start needs a MODULE.bazel change first.
      - uses: actions/cache@v6
        with:
          path: |
            /mnt/rules_ts_it/repository_cache
            /mnt/rules_ts_it/disk_cache
          key: nested-bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'tests/npm/pnpm-lock.yaml', 'oxc_cli/Cargo.lock') }}
          restore-keys: |
            nested-bazel-${{ runner.os }}-

      # The tests carry "cpu:2", not "exclusive", so Bazel already runs as many
      # as this runner has cores for; the config picks which of them this leg
      # owns.
      - name: Integration suite (${{ matrix.shard }})
        run: |
          set -o pipefail
          bazelisk test --config=ci-integration-${{ matrix.shard }} \
            //tests/integration/... \
            --test_env=RULES_TS_IT_SCRATCH=/mnt/rules_ts_it 2>&1 \
            | tee "${RUNNER_TEMP}/integration.log"

      # Bazel intermittently fails to stage a node_modules tree into the
      # sandbox -- "[unix_jni.cc:281] <path> (No such file or directory)" for a
      # directory inside its own output base, on a different path each time. It
      # has never reproduced outside CI, so the state at the moment of failure
      # is the evidence that is missing: whether the path is absent, a symlink,
      # or a dangling one, and whether the volume simply filled up.
      - name: Diagnose a sandbox staging failure
        if: failure()
        run: |
          df -h /mnt /
          log="${RUNNER_TEMP}/integration.log"
          [ -f "$log" ] || { echo "no suite log"; exit 0; }
          paths=$(grep -oE '\[unix_jni\.cc:[0-9]+\] [^ ]+' "$log" \
            | awk '{print $2}' | sort -u)
          [ -n "$paths" ] || { echo "no unix_jni path in the log"; exit 0; }
          for p in $paths; do
            echo "=== reported missing: $p"
            cur="$p"
            while [ "$cur" != "/" ] && [ ! -e "$cur" ] && [ ! -L "$cur" ]; do
              echo "    absent: $cur"
              cur=$(dirname "$cur")
            done
            echo "    first existing ancestor:"
            ls -ld "$cur"
            ls -la "$cur" | head -40
          done

  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # There is no buildifier bazel_dep in MODULE.bazel: `bazel run
      # @buildifier//:buildifier` fails with "No repository visible as
      # '@buildifier'", so the released binary is what actually runs the check.
      - name: Install buildifier
        run: |
          curl -fsSL -o /usr/local/bin/buildifier \
            https://github.com/bazelbuild/buildtools/releases/download/v8.2.1/buildifier-linux-amd64
          chmod +x /usr/local/bin/buildifier
          buildifier --version

      - name: Check BUILD and .bzl formatting
        run: buildifier --mode=check -r .

      # setup-go, not Bazel: gofmt and go vet read the go.work module graph
      # straight off the source tree, so no part of this comes from the build
      # graph and there is nothing for a Bazel invocation to contribute.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            gazelle/go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt is not clean. Run gofmt -w on:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      # tools/quickstart is named out rather than excluded: its go:embed target is
      # a genrule output, and `go list` failing there aborts a whole ./... pattern.
      - name: Vet Go
        run: |
          go vet ./gazelle/... ./tests/... ./ts/... \
            ./tools/copy_to_workspace/... ./tools/launcher/... ./tools/release/...

      # docs.yml builds the site only on push to main, so until now a PR that
      # broke the nav or a page reference was caught after it had already merged.
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Build the docs site
        run: |
          pip install mkdocs-material
          mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
