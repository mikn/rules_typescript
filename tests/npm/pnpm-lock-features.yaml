# A second, deliberately tiny lockfile for the pnpm features that are not about
# graph size: patched dependencies, npm alias specifiers, peer-dependency
# variants and per-importer resolution, plus the blocks a reader has to walk past
# without reading (catalogs, overrides).
#
# Separate from pnpm-lock.yaml because that file is copied verbatim into the
# integration and bootstrap scratch workspaces, which know nothing about patch
# files; a patchedDependencies entry there would fail every one of them.
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

# Neither block may reach a target. Both are already resolved at every use site,
# and both are shaped like blocks that ARE read -- a catalog nests the same
# specifier/version pairs an importer does, and `nanoid@2` reads as a package
# key -- so the only thing keeping them out is that each reader anchors on its
# own section header.
catalogs:
  default:
    zod:
      specifier: 3.24.2
      version: 3.24.2
    catalog-only-package:
      specifier: npm:nanoid@9.9.9
      version: nanoid@9.9.9

overrides:
  nanoid@2: 3.3.11
  'zod>nanoid': 3.3.11

# The patch's own sha256. pnpm writes this when it writes the patch, so it is a
# usable content check on the file before it is applied.
patchedDependencies:
  nanoid@3.3.11: c55f4f6ee369a589edbbc9e7c7d0731b078544f72aed77ff416bdc9d831333fd

importers:

  .:
    dependencies:
      zod:
        specifier: 3.24.2
        version: 3.24.2
      # An npm alias declared only here, by the workspace root. No package in
      # the graph names it, so the label exists only if importers are read for
      # aliases as well as for workspace links.
      ms-alias:
        specifier: npm:ms@2.1.3
        version: ms@2.1.3

  # Two workspace members that resolve one name to two different majors, and one
  # package that pnpm resolved twice -- once per peer set. Both are recorded the
  # way pnpm records them: the importer names the snapshot it got, and the
  # snapshot key carries the peer set (compare
  # '@vitest/mocker@3.0.9(vite@6.4.1)' in tests/npm/pnpm-lock.yaml).
  #
  # The peer relationship itself is invented -- ansi-styles has no peer on
  # ansi-regex -- so that the fixture stays four real tarballs instead of a
  # storybook/react closure. What is under test is the SHAPE, and every
  # integrity here is the published one, so the packages really download.
  # A member whose own directory is named after an npm package in the same
  # lockfile: the hub then needs a package `ms/` and a target `:ms` side by side.
  ms:
    dependencies:
      zod:
        specifier: 3.24.2
        version: 3.24.2

  app-a:
    dependencies:
      ansi-regex:
        specifier: ^5.0.0
        version: 5.0.1
      ansi-styles:
        specifier: ^6.0.0
        version: 6.2.3(ansi-regex@5.0.1)

  app-b:
    dependencies:
      ansi-regex:
        specifier: ^6.0.0
        version: 6.2.2
      ansi-styles:
        specifier: ^6.0.0
        version: 6.2.3(ansi-regex@6.2.2)

packages:

  # One entry per published tarball, peer sets nowhere in sight: `packages:` is
  # keyed by name@version and says nothing about how many ways a package was
  # resolved.
  ansi-regex@5.0.1:
    resolution: {integrity: sha512-quJQXlTSUGL2LH9SUXo8VwsY4soanhgo6LNSm84E1LBcE8s3O0wpdiRzyR9z/ZZJMlMWv37qOOb9pdJlMUEKFQ==}
    engines: {node: '>=8'}

  ansi-regex@6.2.2:
    resolution: {integrity: sha512-Bq3SmSpyFHaWjPk8If9yc6svM8c56dB5BAtW4Qbw5jHTwwXXcTLoRMkpDJp6VL0XzlWaCHTXrkFURMYmD0sLqg==}
    engines: {node: '>=12'}

  ansi-styles@6.2.3:
    resolution: {integrity: sha512-4Dj6M28JB+oAH8kFkTLUo+a2jwOFkuqb3yucU0CANcRRUbxS0cP0nZYCGjcc3BNXwRIsUVmDGgzawme7zvJHvg==}
    engines: {node: '>=12'}
    peerDependencies:
      ansi-regex: '*'

  ms@2.1.3:
    resolution: {integrity: sha512-6FlzubTLZG3J2a/NVCAleEhjzq5oxgHyaCU9yYXvcLsvoVaHJq/s5xXI6/XXP6tz7R9xAOtHnSO/tXtF3WRTlA==}

  nanoid@3.3.11:
    resolution: {integrity: sha512-N8SpfPUnUp1bK+PMYW8qSWdl9U+wwNWI4QKxOYDy9JAro3WMX7p2OeVRF9v+347pnakNevPmiHhNmZ2HbFA76w==}
    engines: {node: ^10 || ^12 || ^13.7 || ^14 || >=15.0.1}
    hasBin: true

  zod@3.24.2:
    resolution: {integrity: sha512-lY7CDW43ECgW9u1TcT3IoXHflywfVqDYze4waEz812jR/bZ8FHDsl7pFQoSZTz5N+2NqRXs8GBwnAwo3ZNxqhQ==}

snapshots:

  ansi-regex@5.0.1: {}

  ansi-regex@6.2.2: {}

  # The same tarball, twice, with different transitive versions. Collapsing these
  # onto `ansi-styles@6.2.3` leaves whichever the reader saw last, and both
  # importers then build against it.
  ansi-styles@6.2.3(ansi-regex@5.0.1):
    dependencies:
      ansi-regex: 5.0.1

  ansi-styles@6.2.3(ansi-regex@6.2.2):
    dependencies:
      ansi-regex: 6.2.2

  ms@2.1.3: {}

  nanoid@3.3.11: {}

  # An npm alias declared only by a package, so the dependency edge itself has
  # to carry the name zod imports nanoid under.
  zod@3.24.2:
    dependencies:
      nano-alias: nanoid@3.3.11
